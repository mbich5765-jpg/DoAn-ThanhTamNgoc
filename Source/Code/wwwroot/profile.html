<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ sơ cá nhân - Thanh Tâm Ngọc</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            color: #333;
        }

        .container {
            max-width: 1100px;
            margin: 50px auto;
            display: flex;
            gap: 30px;
            padding: 0 20px;
        }

        .sidebar {
            width: 280px;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            height: fit-content;
        }

        .main-content {
            flex: 1;
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        .user-info {
            text-align: center;
            margin-bottom: 30px;
        }

            .user-info img {
                width: 100px;
                height: 100px;
                border-radius: 50%;
                border: 3px solid #1c7c54;
                margin-bottom: 15px;
            }

            .user-info h3 {
                margin: 10px 0 5px;
                color: #1c7c54;
            }

        .menu-link {
            display: block;
            padding: 12px 15px;
            color: #555;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 8px;
            transition: 0.3s;
            font-weight: 500;
        }

            .menu-link.active, .menu-link:hover {
                background: #e8f5e9;
                color: #1c7c54;
            }

        .section-title {
            font-size: 1.5em;
            color: #1c7c54;
            margin-bottom: 25px;
            border-bottom: 2px solid #e8f5e9;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 0.9em;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
        }

        .btn-save {
            background: #1c7c54;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 1em;
            transition: 0.3s;
        }

            .btn-save:hover {
                background: #145a3d;
            }

        .order-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

            .order-table th {
                background: #f8f9fa;
                text-align: left;
                padding: 15px;
                border-bottom: 2px solid #eee;
            }

            .order-table td {
                padding: 15px;
                border-bottom: 1px solid #eee;
                line-height: 1.5;
            }

        .status-pill {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .status-done {
            background: #e8f5e9;
            color: #2e7d32;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <div class="user-info">
                <img src="https://ui-avatars.com/api/?name=Huynh+Bich+Tran&background=1c7c54&color=fff" alt="Avatar">
                <h3 id="display-name">Huỳnh Bích Trân</h3>
                <p style="font-size: 0.85em; color: #888;">Thành viên thân thiết</p>
            </div>
            <nav>
                <a href="#" class="menu-link active" onclick="showSection('profile')">Thông tin cá nhân</a>
                <a href="#" class="menu-link" onclick="showSection('orders')">Lịch sử mua hàng</a>
                <a href="#" onclick="logout()" class="menu-link" style="color: #d32f2f;">Đăng xuất</a>
            </nav>
            <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee; text-align: center;">
                <a href="index.html" style="text-decoration: none; color: #1c7c54; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 5px; transition: 0.3s;" onmouseover="this.style.color='#f0a500'" onmouseout="this.style.color='#1c7c54'">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7" /></svg>
                    Quay lại Trang Chủ
                </a>
            </div>
        </div>

        <div class="main-content" id="profile-section">
            <div class="section-title">Hồ sơ cá nhân</div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="form-group">
                    <label>Họ và Tên</label>
                    <input type="text" id="p-name">
                </div>
                <div class="form-group">
                    <label>Số điện thoại</label>
                    <input type="text" id="p-phone" placeholder="Chưa cập nhật">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="p-email" readonly style="background: #f9f9f9;">
                </div>
                <div class="form-group">
                    <label>Ngày sinh</label>
                    <input type="date" id="p-birth">
                </div>
                <div class="form-group" style="grid-column: span 2;">
                    <label>Địa chỉ nhận hàng</label>
                    <input type="text" id="p-address" placeholder="Nhập địa chỉ của bạn">
                </div>
            </div>
            <button class="btn-save" onclick="updateProfile()">Cập nhật thông tin</button>
        </div>

        <div class="main-content" id="orders-section" style="display: none;">
            <div class="section-title">Lịch sử mua hàng</div>
            <table class="order-table">
                <thead>
                    <tr>
                        <th>Mã đơn</th>
                        <th>Ngày đặt</th>
                        <th>Sản phẩm</th>
                        <th>Tổng tiền</th>
                        <th>Trạng thái</th>
                    </tr>
                </thead>
                <tbody id="order-list">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let userEmail = urlParams.get('email');

        if (!userEmail) {
            userEmail = localStorage.getItem('userEmail');
        }

        window.onload = function () {
            if (!userEmail) {
                alert("Vui lòng đăng nhập!");
                window.location.href = "index.html";
                return;
            }

            fetch(`/api/account/profile/${userEmail}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('display-name').innerText = data.name;
                    document.getElementById('p-name').value = data.name;
                    document.getElementById('p-email').value = data.email;
                    document.getElementById('p-phone').value = data.phone || '';
                    document.getElementById('p-address').value = data.address || '';
                })
                .catch(err => console.error(err));

            loadOrderHistory();
        }

        function loadOrderHistory() {
            fetch(`/api/orders/history/${userEmail}`)
                .then(res => res.json())
                .then(data => {
                    const tbody = document.getElementById('order-list');
                    tbody.innerHTML = '';

                    if (!data || data.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#888;">Bạn chưa có đơn hàng nào.</td></tr>';
                        return;
                    }

                    data.forEach(order => {
                        const price = new Intl.NumberFormat('vi-VN').format(order.totalAmount) + ' VNĐ';
                        tbody.innerHTML += `
                                <tr>
                                    <td style="font-weight:bold;">#TTN${order.orderId}</td>
                                    <td>${order.orderDate}</td>
                                    <td>${order.products}</td>
                                    <td style="color:#d32f2f; font-weight:bold;">${price}</td>
                                    <td><span class="status-pill status-done">${order.status}</span></td>
                                </tr>
                            `;
                    });
                })
                .catch(err => console.error(err));
        }

        function updateProfile() {
            const dataToSave = {
                Email: userEmail,
                FullName: document.getElementById('p-name').value,
                Phone: document.getElementById('p-phone').value,
                Address: document.getElementById('p-address').value,
                Birthday: document.getElementById('p-birth').value
            };

            fetch('/api/account/update-profile', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dataToSave)
            })
                .then(res => res.json())
                .then(result => {
                    alert(result.message);
                    window.location.reload();
                })
                .catch(err => alert("Không thể kết nối đến máy chủ!"));
        }

        function showSection(section) {
            document.getElementById('profile-section').style.display = section === 'profile' ? 'block' : 'none';
            document.getElementById('orders-section').style.display = section === 'orders' ? 'block' : 'none';
            document.querySelectorAll('.menu-link').forEach(link => link.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        function logout() {
            localStorage.removeItem('userEmail');
            localStorage.removeItem('userName');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
